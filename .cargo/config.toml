[build]
target = "x86_64-unknown-uefi"

[target.x86_64-unknown-uefi]
runner = "powershell -ExecutionPolicy Bypass -File scripts/run.ps1"
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=/SUBSYSTEM:EFI_APPLICATION",
    "-C", "link-arg=/ENTRY:efi_main",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    "-C", "link-arg=/MERGE:.rdata=.text",
]
