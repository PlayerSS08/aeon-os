[package]
name = "aeon"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "Aeon: UEFI x86_64 boot stage of an educational Rust micro-OS"

[features]
# Deliberate-failure switches for exercising the fault paths (TC5).
fault-ud = []
fault-pf = []
fault-stack = []
fault-wx = []
fault-nx = []
fault-panic = []
# Dumps the TCG event log as hex on the log sinks, to capture a golden fixture for the parser tests.
dump-eventlog = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.dev]
panic = "abort"
opt-level = "s"
overflow-checks = true
debug = true

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
strip = "debuginfo"
